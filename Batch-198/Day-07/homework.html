<body>
    <script>
        //task1. ex3
        /*
        * * * * * *
        * * * * *
        * * * *
        * * *
        * *
        *
        */
        for (let index = 1; index <= 6; index++) {
            //console.log(7 - index);
            const max = (7 - index)
            let html = "";
            for (let j = 0; j < max; j++) {
                html += "*"
            }
            console.log(html);
        }
        // bảng cửu chương
        for (let i = 2; i <= 9; i++) {
            console.log(`Bảng cửu chương ${i}`);

            for (let j = 1; j <= 10; j++) {
                console.log(`${i} x ${j} = ${i * j}`);
            }

            console.log("--------------------");
        }
    </script>
